<!doctype html>
<html><body style="font-family: -apple-system, system-ui, sans-serif; background: #FAF8F2; padding: 32px;">
  <div style="max-width: 560px; margin: 0 auto; background: #FFFFFF; border: 1px solid #E8DFC9; border-radius: 14px; padding: 32px;">
    <div style="font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: #8A7340;">Alpago HR</div>
    <h1 style="font-family: 'Cormorant Garamond', serif; font-size: 26px; margin: 16px 0 20px; color: #1A1512; font-weight: 400;">{{ title }}</h1>
    <p style="color: #4A443D; line-height: 1.65;">{{ body }}</p>
    {% if cta_url %}
    <p style="margin: 24px 0;"><a href="{{ cta_url }}" style="color: #8A7340; font-weight: 600;">{{ cta_label|default('Open →') }}</a></p>
    {% endif %}
  </div>
</body></html>
