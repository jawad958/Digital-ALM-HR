[project]
name = "alpago-hr-api"
version = "0.1.0"
description = "Alpago HR Platform — backend API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.35",
  "alembic>=1.13",
  "aiosqlite>=0.20",     # SQLite async driver — local dev
  "psycopg[binary]>=3.2",# Postgres driver — Render
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "python-multipart>=0.0.17",
  "celery[redis]>=5.4",
  "redis>=5.1",
  "httpx>=0.27",
  "anthropic>=0.39",
  "boto3>=1.35",         # S3-compatible for Cloudflare R2
  "jinja2>=3.1",
  "python-dateutil>=2.9",
  "structlog>=24.4",
  "sentry-sdk[fastapi]>=2.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-python-jose",
  "types-passlib",
  "freezegun>=1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alpago*"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
