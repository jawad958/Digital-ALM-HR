# Render.com infrastructure blueprint.
# See https://render.com/docs/blueprint-spec

databases:
  - name: alpago-postgres
    plan: starter
    databaseName: alpago_hr
    user: alpago
    postgresMajorVersion: 16

services:
  # Backend API
  - type: web
    name: alpago-api
    env: python
    plan: starter
    rootDir: apps/api
    region: frankfurt   # closest low-latency option until Bahrain is GA
    buildCommand: pip install -e . && alembic upgrade head
    startCommand: uvicorn alpago.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        fromDatabase: {name: alpago-postgres, property: connectionString}
      - key: REDIS_URL
        fromService: {name: alpago-redis, type: redis, property: connectionString}
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET
        value: alpago-hr-prod
      - key: ENV
        value: production

  # Celery worker (background jobs: notifications, AI, OCR, scheduled checks)
  - type: worker
    name: alpago-worker
    env: python
    plan: starter
    rootDir: apps/api
    region: frankfurt
    buildCommand: pip install -e .
    startCommand: celery -A alpago.workers.celery_app worker --loglevel=info --concurrency=4
    envVars:
      - fromGroup: alpago-shared-env

  # Celery beat (scheduled tasks: SLA checks, document expiry alerts)
  - type: worker
    name: alpago-beat
    env: python
    plan: starter
    rootDir: apps/api
    region: frankfurt
    buildCommand: pip install -e .
    startCommand: celery -A alpago.workers.celery_app beat --loglevel=info
    envVars:
      - fromGroup: alpago-shared-env

  # Redis for Celery broker + session store
  - type: redis
    name: alpago-redis
    plan: starter
    region: frankfurt
    ipAllowList: []

  # Frontend
  - type: web
    name: alpago-web
    env: node
    plan: starter
    rootDir: apps/web
    region: frankfurt
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: API_URL
        value: https://alpago-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://alpago-api.onrender.com
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        value: https://alpago-web.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

envVarGroups:
  - name: alpago-shared-env
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: alpago-postgres, property: connectionString}
      - key: REDIS_URL
        fromService: {name: alpago-redis, type: redis, property: connectionString}
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET
        value: alpago-hr-prod
      - key: ENV
        value: production
